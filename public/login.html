<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>mall-system 登录</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f5f6f8; font-family: "Microsoft YaHei", sans-serif; }
  .card { width: 360px; background: #fff; border-radius: 8px; padding: 32px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  h1 { font-size: 20px; margin: 0 0 24px; text-align: center; color: #222; }
  label { display: block; font-size: 13px; color: #555; margin: 14px 0 6px; }
  input { width: 100%; box-sizing: border-box; height: 36px; padding: 0 10px; border: 1px solid #d0d3d9; border-radius: 4px; font-size: 14px; }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  .row input { flex: 1; }
  button { width: 100%; height: 38px; margin-top: 22px; border: 0; border-radius: 4px; background: #1f6feb; color: #fff; font-size: 15px; cursor: pointer; }
  #msg { margin-top: 14px; min-height: 20px; font-size: 13px; color: #d1242f; text-align: center; }
  .tip { margin-top: 16px; font-size: 12px; color: #888; text-align: center; }
</style>
</head>
<body>
<div class="card">
  <h1>mall-system 商家后台</h1>
  <form id="loginForm">
    <label for="username">用户名</label>
    <input id="username" name="username" autocomplete="off" />
    <label for="password">密码</label>
    <input id="password" name="password" type="password" autocomplete="off" />
    <label for="captcha">验证码</label>
    <div class="row">
      <input id="captcha" name="captcha" autocomplete="off" />
      <img id="captchaImg" src="/captcha.svg" alt="验证码" title="点击刷新" width="120" height="44" style="cursor:pointer;border-radius:4px" />
    </div>
    <button type="submit">登录</button>
    <div id="msg"></div>
  </form>
  <div class="tip">演示账号 wang / 123456h</div>
</div>
<script>
  const img = document.getElementById('captchaImg');
  img.addEventListener('click', () => { img.src = '/captcha.svg?t=' + Date.now(); });
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const body = {
      username: document.getElementById('username').value,
      password: document.getElementById('password').value,
      captcha: document.getElementById('captcha').value
    };
    const res = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const data = await res.json();
    const msg = document.getElementById('msg');
    if (data.ok) { msg.style.color = '#1a7f37'; msg.textContent = '登录成功，正在跳转…'; location.href = '/home'; }
    else { msg.style.color = '#d1242f'; msg.textContent = data.message || '登录失败'; }
  });
</script>
</body>
</html>
